name: Bug Report
title: "[BUG]"
description: Report a bug found in the application.
labels: bug

body:
    - type: markdown
      attributes:
          value: |
              ## Bug Report
              Please provide detailed information about the issue you encountered.

    - type: textarea
      id: bug-description
      attributes:
          label: Description of the bug
          description: A clear and concise description of what the bug is.
          placeholder: Describe the issue you are experiencing.
      validations:
          required: true

    - type: textarea
      id: steps-to-reproduce
      attributes:
          label: Steps to reproduce the bug
          description: Steps to reproduce the behavior.
          placeholder: "1. Go to '...'
              2. Click on '...'
              3. Scroll down to '...'
              4. See error"
      validations:
          required: true

    - type: textarea
      id: expected-behaviour
      attributes:
          label: Expected behaviour
          description: A clear and concise description of what you expected to happen.
          placeholder: What did you expect the application to do?
      validations:
          required: false

    - type: input
      id: windows-version
      attributes:
          label: Windows version
          description: Which version of Windows are you using?
          placeholder: e.g., Windows 11 Pro 24H2
      validations:
          required: true

    - type: input
      id: app-version
      attributes:
          label: App version
          description: Which version of WinProcess are you using?
          placeholder: e.g., v1.2.2
      validations:
          required: true
